name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      SOURCECODE_BRANCH:
        description: '源码分支名称或修订版'
        required: true
        default: 'chopin_kvm'
      SUKISU_BRANCH:
        description: 'ReSukiSU 分支名称或修订版'
        required: true
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_MAXSIZE: 8G
    strategy:
      fail-fast: false
    name: Build Kernel for K40GE
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Package
        run: sudo apt update && sudo apt install -y p7zip-full git ccache gcc git

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - uses: actions/checkout@v5

      - name: Get Kernel Source Code
        uses: actions/checkout@v5
        with:
          repository: James-2HBe/kernel_mt6893
          ref: chopin_kvm
          path: kernel
      
      - name: Setup Cross-compile toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget -q https://github.com/Mandi-Sa/clang/releases/download/amd64-kernel-arm_static-23/llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          7za x llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z
          rm llvm23.0.0-binutils2.45.1_amd64-kernel-arm_static-20260224.7z

      - name: Get susfs patch
        uses: actions/checkout@v5
        with:
          repository: JackA1ltman/NonGKI_Kernel_Build_2nd
          sparse-checkout: Patches/Patch
          ref: mainline
          path: susfs_patch

      - name: Patch Kernel
        run: |
          cd kernel
          # 先打无问题的补丁
          patch -p1 < $GITHUB_WORKSPACE/Patches/fix_restore_cgroup_file_prefix_handling.patch
          patch -p1 < $GITHUB_WORKSPACE/Patches/static-symbol-export.patch
          patch -p1 < $GITHUB_WORKSPACE/Patches/ksu_hooks_4.14.patch

          # 使用 Python 自动化处理 susfs 的插入，彻底避免 patch 格式错误
          python3 -c '
          import os

          # 1. 修复 fs/exec.c
          with open("fs/exec.c", "r") as f:
              content = f.read()

          exec_inc = """#ifdef CONFIG_KSU_SUSFS
          #include <linux/susfs_def.h>
          #endif
          """
          if exec_inc not in content:
              content = content.replace("#include <linux/vmalloc.h>", "#include <linux/vmalloc.h>\n" + exec_inc)

          exec_hook1 = """#ifdef CONFIG_KSU_SUSFS
          extern bool ksu_su_compat_enabled __read_mostly;
          extern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;
          extern bool __ksu_is_allow_uid_for_current(uid_t uid);
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);
          #endif
          """
          if "ksu_handle_execveat" not in content:
              content = content.replace("static int do_execveat_common(", exec_hook1 + "\nstatic int do_execveat_common(")

          exec_hook2 = """#ifdef CONFIG_KSU_SUSFS
          \tif (likely(susfs_is_current_proc_umounted()) || !ksu_su_compat_enabled)
          \t\tgoto orig_flow;

          \tif (static_branch_unlikely(&susfs_is_sdcard_android_data_not_decrypted))
          \t\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          \telse
          \t\tksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);

          orig_flow:
          #endif
          """
          if "orig_flow:" not in content:
              content = content.replace("if (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);", "if (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);\n" + exec_hook2)

          with open("fs/exec.c", "w") as f:
              f.write(content)

          # 2. 修复 kernel/reboot.c
          with open("kernel/reboot.c", "r") as f:
              r_content = f.read()

          reboot_hook1 = """#ifdef CONFIG_KSU
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);
          #endif
          """
          if "ksu_handle_sys_reboot" not in r_content:
              r_content = r_content.replace("SYSCALL_DEFINE4(reboot,", reboot_hook1 + "\nSYSCALL_DEFINE4(reboot,")

          reboot_hook2 = """#ifdef CONFIG_KSU_SUSFS
          \tret = ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
          \tif (ret) {
          \t\tgoto orig_flow;
          \t}
          \treturn ret;
          orig_flow:
          #endif
          """
          if "ksu_handle_sys_reboot(magic1" not in r_content:
              r_content = r_content.replace("int ret = 0;", "int ret = 0;\n" + reboot_hook2)

          with open("kernel/reboot.c", "w") as f:
              f.write(r_content)
          '


      - name: Set up ReSukiSU
        working-directory: kernel
        run: |
          echo DATE=$(date +%F) >> $GITHUB_ENV
          export BRANCH=${{ inputs.SUKISU_BRANCH }}
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s $BRANCH
          cd ./KernelSU
          export KSU_VERSION=$(expr $(/usr/bin/git rev-list --count main) "+" 30000 "+" 700)
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          sed -i "s/DKSU_VERSION=12800/DKSU_VERSION=${KSU_VERSION}/" kernel/Makefile

      - name: Get SukiSU Patches
        uses: actions/checkout@v5
        with:
          repository: SukiSU-Ultra/SukiSU_patch
          path: sukisu_patch

      - name: Setup BBG
        run: |
          cd /home/runner/work/xiaomi_ares_sukisu/xiaomi_ares_sukisu/kernel
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' security/Kconfig

      - name: Apply KernelPatch for SUSFS
        working-directory: kernel
        run: |
          patch -p1 < $GITHUB_WORKSPACE/susfs_patch/Patches/Patch/susfs_patch_to_4.14.patch || true
          patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_taskmmu.patch
          if [ "${{ inputs.SOURCECODE_BRANCH }}" = "chopin_kvm" ]; then
            patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_base.patch
            patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_fdinfo.patch
            patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_readdir.patch
          elif [ "${{ inputs.SOURCECODE_BRANCH }}" = "chopin_kvm" ]; then
            patch -p1 < $GITHUB_WORKSPACE/Patches/susfs_patch_newuname.patch
          fi

      - name: Copy defconfig
        run: |
          cat $GITHUB_WORKSPACE/Patches/ares_user_defconfig_append >> $GITHUB_WORKSPACE/kernel/arch/arm64/configs/ares_defconfig
      
      - name: Build Kernel for K40GE
        working-directory: kernel
        env:
          args: |+
            LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-liopen_fix.patchnux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- CROSS_COMPILE_COMPAT=arm-linux-gnueabi-
            CC=clang LD=ld.lld HOSTLD=ld.lld O=out KCFLAGS+=-O2 KCFLAGS_PERF+=-O3
        run: |
          export KBUILD_BUILD_TIMESTAMP=$(date)
          export PATH=/usr/lib/ccache:$GITHUB_WORKSPACE/toolchain/bin:$PATH
          make -j$(nproc --all) ${args} ares_defconfig all
      
      - name: Apply KernelPatch for KPM
        if: ${{ inputs.enable_feature_kpm }}
        working-directory: kernel/out/arch/arm64/boot
        run: |
          cp $GITHUB_WORKSPACE/sukisu_patch/kpm/patch_linux .
          chmod +x patch_linux
          ./patch_linux
          mv oImage Image

      - name: Pack Kernel using Magiskboot
        working-directory: Magiskboot
        run: |
            tar -xvf boot.tar.gz
            chmod +x magiskboot
            ./magiskboot unpack boot.img
            cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image ./kernel
            ./magiskboot repack boot.img boot_KSU_${{ env.KSUVER }}.img

      - name: Upload repacked boot image
        uses: actions/upload-artifact@v4
        with:
          name: K40GE_KSU_${{ env.KSUVER }}
          path: Magiskboot/boot_KSU_${{ env.KSUVER }}.img
          compression-level: 9

      - name: Upload rejects
        if: failure()
        uses: actions/upload-artifact@v4
        with:
           name: patch-rejects
           path: '**/*.rej'
